<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A real-time weather forecast and climate telemetry dashboard."
  >
  <title>WeatherNow | Real-Time Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app-container">
    <header class="app-header">
      <div>
        <p class="eyebrow">LIVE CLIMATE TELEMETRY</p>
        <h1>WeatherNow</h1>
        <p class="subtitle">
          Search any city to view current weather conditions and a five-day forecast.
        </p>
      </div>
    </header>

    <section class="search-section" aria-label="Search weather by city">
      <form id="search-form">
        <label for="city-input">Search for a city</label>
        <div class="search-row">
          <input
            type="text"
            id="city-input"
            placeholder="Enter a city name"
            autocomplete="off"
            required
          >
          <button type="submit">Search</button>
        </div>
      </form>
    </section>

    <section id="loading" class="loading hidden" aria-live="polite">
      <div class="spinner"></div>
      <p>Fetching live weather data...</p>
    </section>

    <section
      id="error-message"
      class="error-message hidden"
      role="alert"
      aria-live="assertive"
    ></section>

    <section id="weather-content" class="weather-content hidden">
      <article class="current-weather">
        <div class="location-info">
          <p id="location-name" class="location-name">--</p>
          <p id="current-date" class="current-date">--</p>
        </div>

        <div class="weather-main">
          <div class="temperature-block">
            <img
              id="weather-icon"
              src=""
              alt=""
              class="weather-icon"
            >
            <p id="temperature" class="temperature">--°C</p>
          </div>

          <div class="condition-block">
            <h2 id="weather-condition">--</h2>
            <p id="weather-description">--</p>
            <p id="feels-like">Feels like --°C</p>
          </div>
        </div>

        <div class="telemetry-grid">
          <div class="telemetry-card">
            <span class="telemetry-label">Humidity</span>
            <strong id="humidity">--%</strong>
          </div>

          <div class="telemetry-card">
            <span class="telemetry-label">Wind Speed</span>
            <strong id="wind-speed">-- m/s</strong>
          </div>

          <div class="telemetry-card">
            <span class="telemetry-label">Pressure</span>
            <strong id="pressure">-- hPa</strong>
          </div>
        </div>
      </article>

      <section class="forecast-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">OUTLOOK</p>
            <h2>5-Day Forecast</h2>
          </div>
        </div>

        <div id="forecast-grid" class="forecast-grid"></div>
      </section>
    </section>
  </main>

  <footer>
    <p>Weather data provided by OpenWeatherMap.</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
